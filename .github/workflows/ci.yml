name: PowerShell Module CI

# semgrep:ignore yaml.github-actions.security.curl-eval.curl-eval
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true
      CODACY_API_TOKEN:
        required: true

env:
  POWERSHELL_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # renovate: datasource=github-releases depName=PowerShell/PowerShell
  POWERSHELL_VERSION: '7.6.9'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-26.04]
    name: Test on ${{ matrix.os }} with PowerShell
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanning
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PowerShell
        uses: milliewalky/setup-pwsh@111b66da66b9e4c068052ed1ae34fcbeb9adcf36 # v1
        with:
          tag: 'v${{ env.POWERSHELL_VERSION }}'

      - name: Cache PowerShell modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/powershell/Modules
            ~/Documents/PowerShell/Modules
            ~/Library/PowerShell/Modules
          key: ${{ matrix.os }}-v${{ env.POWERSHELL_VERSION }}-pwshmodules-${{ hashFiles('**/BridgeWatcher.psd1') }}
          restore-keys: |
            ${{ matrix.os }}-v${{ env.POWERSHELL_VERSION }}-pwshmodules-

      - name: Install required PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          $modules = @('Pester', 'PSScriptAnalyzer')
          foreach ($module in $modules) {
            Write-Verbose "Installing $module..."
            Install-Module -Name $module -Force -Scope CurrentUser -ErrorAction Stop
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Write-Verbose "Running PSScriptAnalyzer..."
          $analysisResults = @(
            Invoke-ScriptAnalyzer -Path ./BridgeWatcher -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
            Invoke-ScriptAnalyzer -Path ./Tests -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          )
          if ($analysisResults.Count -gt 0) {
            $analysisResults | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found $($analysisResults.Count) issues!"
            exit 1
          } else {
            Write-Verbose "No PSScriptAnalyzer issues found"
          }

      - name: Validate module manifest
        shell: pwsh
        run: |
          Write-Verbose "Validating module manifest..."
          $manifestPath = Get-ChildItem -Path . -Filter "*.psd1" -Recurse | Where-Object { $_.BaseName -eq $_.Directory.Name } | Select-Object -First 1
          if (-not $manifestPath) {
            Write-Error "Module manifest (.psd1) not found!"
            exit 1
          }
          try {
            $manifest = Test-ModuleManifest -Path $manifestPath.FullName -ErrorAction Stop
            Write-Verbose " Module manifest is valid"
            Write-Verbose "Module: $($manifest.Name) v$($manifest.Version)"
          } catch {
            Write-Error "Module manifest validation failed: $($_.Exception.Message)"
            exit 1
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Verbose "Running Pester tests..."
          if (Test-Path ./Tests/PesterConfiguration.psd1) {
            $config = New-PesterConfiguration -Hashtable (Import-PowerShellDataFile ./Tests/PesterConfiguration.psd1)
            $result = Invoke-Pester -Configuration $config
            if ($result.Result -ne 'Passed') {
              Write-Error " Tests failed! $($result.FailedCount) of $($result.TotalCount) tests failed"
              exit 1
            } else {
              Write-Verbose " All $($result.TotalCount) tests passed"
            }
          } else {
            Write-Error "PesterConfiguration.psd1 not found!"
            exit 1
          }

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.os }}-v${{ env.POWERSHELL_VERSION }}
          path: |
            testResults.xml
            coverage.xml
          retention-days: 7

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: testResults.xml
          report_type: test_results

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-v${{ env.POWERSHELL_VERSION }}
          fail_ci_if_error: true

      - name: Run Codacy Coverage Reporter
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_ORGANIZATION_PROVIDER: gh
          CODACY_USERNAME: mrjcap
          CODACY_PROJECT_NAME: BridgeWatcher
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage.xml
          bash <(curl -Ls https://coverage.codacy.com/get.sh) final
