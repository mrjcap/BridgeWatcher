name: PowerShell Documentation

on:
  pull_request:
    branches: [main]
    paths:
      - 'BridgeWatcher/**'
      - 'docs/**'
      - '.github/workflows/powershell-docs.yml'
  workflow_call:
    secrets:
      RELEASE_TOKEN:
        required: false

permissions:
  contents: read

env:
  POWERSHELL_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # renovate: datasource=github-releases depName=PowerShell/PowerShell
  POWERSHELL_VERSION: '7.6.9'

jobs:
  generate-docs:
    name: Generate PowerShell Documentation
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    if: "!contains(github.event.head_commit.message, '[skip docs]') && !contains(github.event.head_commit.message, 'docs: auto-generate')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: ${{ github.event_name != 'pull_request' }}

      - name: Setup PowerShell
        uses: milliewalky/setup-pwsh@111b66da66b9e4c068052ed1ae34fcbeb9adcf36 # v1
        with:
          tag: 'v${{ env.POWERSHELL_VERSION }}'

      - name: Cache PowerShell modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/powershell/Modules
          key: ${{ runner.os }}-docs-v${{ env.POWERSHELL_VERSION }}-pwshmodules-${{ hashFiles('**/BridgeWatcher.psd1') }}
          restore-keys: |
            ${{ runner.os }}-docs-v${{ env.POWERSHELL_VERSION }}-pwshmodules-

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          Write-Verbose "Installing required modules..."
          $modules = @(
            @{ Name = 'platyPS'; MinimumVersion = '0.14.2' }
            @{ Name = 'PSScriptAnalyzer'; MinimumVersion = '1.21.0' }
          )

          foreach ($module in $modules) {
            Write-Verbose "Installing $($module.Name)..."
            Install-Module -Name $module.Name -MinimumVersion $module.MinimumVersion -Force -Scope CurrentUser -AllowClobber
          }

          Write-Verbose " All modules installed successfully"

      - name: Run PSScriptAnalyzer for documentation
        shell: pwsh
        run: |
          Write-Verbose "Running PSScriptAnalyzer for documentation compliance..."

          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity @('Error', 'Warning') -IncludeRule @(
            'PSProvideCommentHelp',
            'PSUseApprovedVerbs',
            'PSUseSingularNouns',
            'PSAvoidUsingCmdletAliases'
          )

          if ($results) {
            Write-Verbose "Documentation-related issues found:"
            $results | Format-Table -AutoSize

            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors) {
              Write-Error " Critical documentation issues found that must be fixed!"
              exit 1
            }
          } else {
            Write-Verbose " No documentation issues found"
          }

      - name: Validate module manifest
        shell: pwsh
        run: |
          Write-Verbose "Validating module manifest..."

          $manifestPath = Get-ChildItem -Path . -Filter "*.psd1" -Recurse |
            Where-Object { $_.BaseName -eq $_.Directory.Name } |
            Select-Object -First 1

          if (-not $manifestPath) {
            Write-Error "Module manifest (.psd1) not found!"
            exit 1
          }

          try {
            $manifest = Test-ModuleManifest -Path $manifestPath.FullName -ErrorAction Stop
            Write-Verbose " Module manifest is valid: $($manifest.Name) v$($manifest.Version)"

            # Store manifest info for later use
            echo "MANIFEST_PATH=$($manifestPath.FullName)" >> $env:GITHUB_ENV
            echo "MODULE_NAME=$($manifest.Name)" >> $env:GITHUB_ENV
            echo "MODULE_VERSION=$($manifest.Version)" >> $env:GITHUB_ENV
          } catch {
            Write-Error "Module manifest validation failed: $($_.Exception.Message)"
            exit 1
          }

      - name: Generate documentation with platyPS
        shell: pwsh
        run: |
          Write-Verbose "Generating PowerShell documentation with platyPS..."

          $manifestPath = $env:MANIFEST_PATH
          $moduleName = $env:MODULE_NAME
          $docsPath = 'docs'

          # Ensure docs directory exists
          if (-not (Test-Path $docsPath)) {
            New-Item -ItemType Directory -Path $docsPath -Force
            Write-Verbose "Created docs directory"
          }

          try {
            # Import the module
            Write-Verbose "Importing module: $moduleName"
            Import-Module $manifestPath -Force -Verbose:$false

            # Hide non-cmdlet docs temporarily to avoid PlatyPS parsing errors
            $tempDocs = Join-Path (Resolve-Path ~).Path 'docs_backup'
            New-Item -ItemType Directory -Path $tempDocs -Force | Out-Null
            $cmdlets = Get-Command -Module $moduleName -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
            $nonCmdletDocs = Get-ChildItem "$docsPath\*.md" -ErrorAction SilentlyContinue | Where-Object { 
              $name = $_.BaseName
              $name -notmatch '^about_' -and $cmdlets -notcontains $name
            }
            if ($nonCmdletDocs) {
              $nonCmdletDocs | Move-Item -Destination $tempDocs
            }

            # Check if cmdlet documentation already exists
            $existingDocs = Get-ChildItem "$docsPath\*.md" -ErrorAction SilentlyContinue

            if ($existingDocs) {
              Write-Verbose "Updating existing documentation..."
              Update-MarkdownHelp -Path $docsPath -Force -Verbose:$false
              Write-Verbose "Creating missing documentation..."
              New-MarkdownHelp -Module $moduleName -OutputFolder $docsPath -Force -Verbose:$false
            } else {
              Write-Verbose "Creating new documentation..."
              New-MarkdownHelp -Module $moduleName -OutputFolder $docsPath -Force -Verbose:$false
            }

            # Restore non-cmdlet docs
            if (Test-Path "$tempDocs\*.md") {
              Get-ChildItem "$tempDocs\*.md" | Move-Item -Destination $docsPath -Force
            }

            # Generate module page if it doesn't exist
            $modulePagePath = Join-Path $docsPath "about_$($moduleName).md"
            if (-not (Test-Path $modulePagePath)) {
              Write-Verbose "Creating module overview page..."
              New-MarkdownAboutHelp -OutputFolder $docsPath -AboutName "about_$($moduleName).md"
              Write-Verbose " Documentation generated successfully"
            }
            # List generated files
            $generatedFiles = Get-ChildItem $docsPath -Filter "*.md"
            Write-Verbose "Generated documentation files:"
            $generatedFiles | ForEach-Object { Write-Verbose "  - $($_.Name)"  }

          } catch {
            Write-Error "Documentation generation failed: $($_.Exception.Message)"
            Write-Verbose "Stack trace: $($_.ScriptStackTrace)"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install markdownlint-cli2 with retries
        run: |
          echo "Installing markdownlint-cli2 with retries..."
          for attempt in 1 2 3; do
            npm install --no-save --ignore-scripts markdownlint-cli2@0.24.0 && break
            echo "npm install failed, retrying (attempt $attempt)..."
            sleep 5
          done
      # Show npm debug logs on failure
      - name: Show npm debug log
        if: failure()
        run: |
          echo "==== NPM DEBUG LOG ===="
          cat /home/runner/.npm/_logs/*.log

      - name: Lint & auto-fix Markdown (warn-only)
        run: |
          ./node_modules/.bin/markdownlint-cli2 "docs/*.md" || EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::warning file=docs::MarkdownLint found issues, but build will continue."
          fi
          exit 0

      - name: Clean npm artifacts
        run: rm -rf node_modules package-lock.json

      - name: Validate generated documentation
        shell: pwsh
        run: |
          Write-Verbose "Validating generated documentation..."

          $docsPath = 'docs'
          $markdownFiles = Get-ChildItem "$docsPath\*.md" -ErrorAction SilentlyContinue

          if (-not $markdownFiles) {
            Write-Error "No documentation files were generated!"
            exit 1
          }

          $issues = @()
          foreach ($file in $markdownFiles) {
            $content = Get-Content $file.FullName -Raw

            # Check for placeholder text that should be filled
            if ($content -match '\{\{ Fill .+ Description \}\}') {
              $issues += "File $($file.Name) contains unfilled placeholders"
            }

            # Check for basic markdown structure
            if ($content -notmatch '^# ') {
              $issues += "File $($file.Name) missing main heading"
            }
          }

          if ($issues) {
            Write-Verbose "Documentation validation issues:"
            $issues | ForEach-Object { Write-Verbose "   $_"  }
          } else {
            Write-Verbose " Documentation validation passed"
          }

      - name: Check for documentation changes
        id: docs_changes
        run: |
          if git diff --quiet HEAD docs/; then
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "No documentation changes detected"
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "Documentation changes detected"
            git diff --name-status docs/
          fi

      - name: Commit documentation changes
        if: steps.docs_changes.outputs.changes_detected == 'true' && github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        continue-on-error: true
        id: auto_commit
        with:
          commit_message: |
            docs: auto-generate PowerShell documentation [skip docs]

            - Updated documentation for module version ${{ env.MODULE_VERSION }}
            - Generated by platyPS via GitHub Actions
          branch: ${{ github.head_ref || github.ref_name }}
          file_pattern: docs/*.md
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: GitHub Actions <actions@github.com>
          push_options: '--force-with-lease'
          skip_fetch: false
          skip_checkout: false

      - name: Manual commit and push on conflict
        if: steps.docs_changes.outputs.changes_detected == 'true' && steps.auto_commit.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Auto-commit failed, attempting manual resolution..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Fetch latest changes and rebase
          git fetch origin
          git pull --rebase origin "$BRANCH_NAME" || true
          
          # Stage and commit documentation changes
          git add docs/*.md
          git commit -m "docs: auto-generate PowerShell documentation [skip docs]

          - Updated documentation for module version ${{ env.MODULE_VERSION }}
          - Generated by platyPS via GitHub Actions" || echo "No changes to commit"
          
          # Push with force-with-lease for safety
          git push origin "$BRANCH_NAME" --force-with-lease

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: powershell-documentation
          path: docs/
          retention-days: 30

      - name: Generate documentation summary
        if: always()
        shell: pwsh
        run: |
          Write-Verbose "� Documentation Generation Summary"
          Write-Verbose "================================="
          Write-Verbose "Module: $env:MODULE_NAME v$env:MODULE_VERSION"
          Write-Verbose "Changes detected: ${{ steps.docs_changes.outputs.changes_detected }}"

          $docsPath = 'docs'
          if (Test-Path $docsPath) {
            $docFiles = Get-ChildItem "$docsPath\*.md" -ErrorAction SilentlyContinue
            Write-Verbose "Documentation files: $($docFiles.Count)"

            if ($docFiles) {
              Write-Verbose "Files generated:"
              $docFiles | ForEach-Object {
                $size = [math]::Round((Get-Item $_.FullName).Length / 1KB, 2)
                Write-Verbose "  � $($_.Name) (${size}KB)"
              }
            }
          }

          Write-Verbose " Documentation workflow completed"
