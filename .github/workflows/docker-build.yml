name: Docker Build, Test and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '0 4 */5 * *'
  workflow_call:
    inputs:
      version:
        description: 'Version tag for the Docker image'
        required: true
        type: string
      dry_run:
        description: 'Perform a dry run without pushing or requiring a release tag'
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: bridgewatcher
  DOCKER_CONTENT_TRUST: 0
  DOCKER_BUILD_SUMMARY: 'false'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: '0.76.2'

jobs:
  validate-filebeat:
    name: Validate Filebeat Configuration
    runs-on: ubuntu-26.04
    steps:
      - name: Record job start time
        id: timing
        run: |
          echo "job_start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{ github.event_name != 'pull_request' && !inputs.dry_run && inputs.version != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout repository (dry run)
        if: ${{ github.event_name == 'pull_request' || inputs.dry_run || inputs.version == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record setup elapsed time
        id: setup_timing
        env:
          JOB_START: ${{ steps.timing.outputs.job_start }}
        run: |
          now=$(date +%s)
          setup_s=$((now - JOB_START))
          echo "setup_s=${setup_s}" >> "$GITHUB_OUTPUT"
          echo "Filebeat setup elapsed: ${setup_s}s"

      - name: Validate Filebeat configuration
        run: |
          set -euo pipefail
          FILEBEAT_IMAGE=$(grep -E 'image:\s*docker\.elastic\.co/beats/filebeat:' docker-compose.yml | awk '{print $2}')
          echo "Validating Filebeat configuration with $FILEBEAT_IMAGE..."
          docker run --rm --entrypoint filebeat \
            -e LOGSTASH_HOST=siem.example.com \
            -v "$(pwd)/Docker/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro" \
            "$FILEBEAT_IMAGE" test config -c /usr/share/filebeat/filebeat.yml --strict.perms=false
          docker run --rm --entrypoint filebeat \
            -e ELASTICSEARCH_HOST=es.example.com -e ELASTICSEARCH_API_KEY="$(openssl rand -hex 8)" \
            -v "$(pwd)/Docker/filebeat.elasticsearch.yml:/usr/share/filebeat/filebeat.yml:ro" \
            "$FILEBEAT_IMAGE" test config -c /usr/share/filebeat/filebeat.yml --strict.perms=false

      - name: Validate compose configuration for the siem profile and syslog override
        run: |
          set -euo pipefail
          LOGSTASH_HOST=siem.example.com docker compose --profile siem config --quiet
          FILEBEAT_CONFIG=./Docker/filebeat.elasticsearch.yml ELASTICSEARCH_HOST=es.example.com \
            ELASTICSEARCH_API_KEY="$(openssl rand -hex 8)" docker compose --profile siem config --quiet
          SYSLOG_ADDRESS=tcp://loghost:514 docker compose -f docker-compose.yml -f docker-compose.syslog.yml config --quiet
          if docker compose -f docker-compose.yml -f docker-compose.syslog.yml config --quiet 2>/dev/null; then
            echo "::error::The syslog override must require SYSLOG_ADDRESS."
            exit 1
          fi

      - name: Report elapsed time
        if: always()
        env:
          JOB_START: ${{ steps.timing.outputs.job_start }}
          SETUP_S: ${{ steps.setup_timing.outputs.setup_s }}
        run: |
          set -euo pipefail
          now=$(date +%s)
          elapsed=$((now - JOB_START))
          echo "Filebeat setup: ${SETUP_S}s"
          echo "Filebeat job execution: ${elapsed}s"

  build-and-test-image:
    name: Build, Test and Scan Docker Image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    outputs:
      image_version: ${{ steps.meta.outputs.version || inputs.version || 'pr-test' }}
      image_digest: ${{ steps.build.outputs.digest || steps.build_release.outputs.digest }}

    steps:
      - name: Record job start time
        id: timing
        run: |
          echo "job_start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{ github.event_name != 'pull_request' && !inputs.dry_run && inputs.version != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout repository (dry run)
        if: ${{ github.event_name == 'pull_request' || inputs.dry_run || inputs.version == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'pull_request' && !inputs.dry_run && inputs.version != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version || 'pr-test' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=BridgeWatcher
            org.opencontainers.image.description=PowerShell module for monitoring bridge status in Corinth Isthmus
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.licenses=MIT

      - name: Check BuildKit main cache marker
        id: buildkit_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/docker-buildkit-seeded.flag
          key: docker-buildkit-seeded-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Docker/Dockerfile') }}
          lookup-only: true

      - name: Record setup elapsed time
        id: setup_timing
        env:
          JOB_START: ${{ steps.timing.outputs.job_start }}
          BUILDKIT_SEEDED: ${{ steps.buildkit_cache.outputs.cache-hit || 'false' }}
        run: |
          now=$(date +%s)
          setup_s=$((now - JOB_START))
          echo "setup_s=${setup_s}" >> "$GITHUB_OUTPUT"
          echo "Docker setup elapsed: ${setup_s}s (buildkit_seeded=${BUILDKIT_SEEDED})"

      - name: Build Docker image
        id: build
        if: ${{ github.event_name == 'pull_request' || inputs.dry_run || inputs.version == '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags || format('{0}/{1}/{2}:pr-test', env.REGISTRY, secrets.DOCKERHUB_USERNAME || github.repository_owner, env.IMAGE_NAME) }}
          labels: ${{ steps.meta.outputs.labels || 'org.opencontainers.image.title=BridgeWatcher' }}
          cache-from: type=gha
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'type=gha,mode=max' || '' }}

      - name: Write BuildKit main cache marker
        if: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && steps.buildkit_cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success' }}
        run: echo "seeded" > /tmp/docker-buildkit-seeded.flag

      - name: Save BuildKit main cache marker
        if: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && steps.buildkit_cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/docker-buildkit-seeded.flag
          key: docker-buildkit-seeded-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Docker/Dockerfile') }}

      - name: Build Docker image (release export)
        id: build_release
        if: ${{ github.event_name != 'pull_request' && !inputs.dry_run && inputs.version != '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Docker/Dockerfile
          platforms: linux/amd64
          load: false
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/bridgewatcher.tar

      - name: Load Docker image for testing
        if: ${{ github.event_name != 'pull_request' && !inputs.dry_run && inputs.version != '' }}
        run: |
          docker load --input /tmp/bridgewatcher.tar

      - name: Test Docker image
        id: e2e
        if: steps.build.outcome == 'success' || steps.build_release.outcome == 'success'
        timeout-minutes: 10
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}
          VERSION: ${{ inputs.version || 'pr-test' }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DOCKER_CONTENT_TRUST: 0
          E2E_FIXTURE_IMAGE: public.ecr.aws/docker/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          E2E_POLL_DEADLINE_SECONDS: '90'
        run: |
          set -euo pipefail
          mkdir -m 0700 test-secrets test-logs
          chmod 750 test-logs
          sudo chown 99:100 test-logs
          printf '%s\n' 'test-api-key' > test-secrets/api_key
          printf '%s\n' 'test-po-api-key' > test-secrets/pushover_token
          printf '%s\n' 'test-po-user-key' > test-secrets/pushover_user
          sudo chmod 0600 test-secrets/{api_key,pushover_token,pushover_user}
          sudo chown 99 test-secrets test-secrets/{api_key,pushover_token,pushover_user}

          export IMAGE_TAG="$DOCKERHUB_USERNAME/$IMAGE_NAME:$VERSION"
          bash Tests/E2E/run-image-e2e.sh happy
          bash Tests/E2E/run-image-e2e.sh pushover-reject

      - name: Upload E2E evidence
        if: always() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-e2e-evidence
          path: e2e-evidence/
          retention-days: 3
          if-no-files-found: ignore

      - name: Scan Docker image for vulnerabilities
        if: always() && (steps.build.outcome == 'success' || steps.build_release.outcome == 'success')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ inputs.version || 'pr-test' }}
          format: 'json'
          output: 'trivy-results.json'
          list-all-pkgs: 'true'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          version: 'v${{ env.TRIVY_VERSION }}'

      - name: Convert Trivy report to SARIF and CycloneDX SBOM
        id: trivy_convert
        if: always() && (steps.build.outcome == 'success' || steps.build_release.outcome == 'success')
        run: |
          set -euo pipefail
          if [ ! -s trivy-results.json ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "sbom_exists=false" >> "$GITHUB_OUTPUT"
            echo "::error::trivy-results.json missing or empty; cannot generate SARIF or CycloneDX SBOM"
            exit 1
          fi
          trivy convert --format sarif --output trivy-results.sarif trivy-results.json
          trivy convert --format cyclonedx --output sbom.json trivy-results.json
          if [ -s trivy-results.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -s sbom.json ]; then
            echo "sbom_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "sbom_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ ! -s trivy-results.sarif ] || [ ! -s sbom.json ]; then
            echo "::error::Converted Trivy SARIF or CycloneDX SBOM is empty"
            exit 1
          fi
          echo "Generated trivy-results.sarif and CycloneDX sbom.json from single Trivy scan"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: always() && steps.trivy_convert.outputs.exists == 'true'
        with:
          sarif_file: 'trivy-results.sarif'
          wait-for-processing: false

      - name: Upload SBOM artifact
        if: always() && steps.trivy_convert.outputs.sbom_exists == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json
          retention-days: 7
          compression-level: 0

      - name: Upload Docker image artifact
        if: ${{ github.event_name != 'pull_request' && !inputs.dry_run && inputs.version != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-image
          path: /tmp/bridgewatcher.tar
          retention-days: 1

      - name: Clean up
        if: always()
        run: |
          timeout 60 docker rm -f bridgewatcher-test-happy bridgewatcher-test-pushover-reject bridgewatcher-e2e-fixture-happy bridgewatcher-e2e-fixture-pushover-reject 2>/dev/null || true
          timeout 60 docker network rm bridgewatcher-e2e-happy bridgewatcher-e2e-pushover-reject 2>/dev/null || true
          sudo rm -rf test-secrets test-logs test-e2e e2e-evidence
          docker system prune -f

      - name: Report elapsed time
        if: always()
        env:
          JOB_START: ${{ steps.timing.outputs.job_start }}
          SETUP_S: ${{ steps.setup_timing.outputs.setup_s }}
          BUILDKIT_SEEDED: ${{ steps.buildkit_cache.outputs.cache-hit || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          now=$(date +%s)
          elapsed=$((now - JOB_START))
          {
            echo "## Docker Build & Test Timing"
            echo "- Event: \`${EVENT_NAME}\`"
            echo "- BuildKit main cache seeded for Dockerfile: \`${BUILDKIT_SEEDED}\`"
            echo "- Setup: \`${SETUP_S}s\`"
            echo "- Job execution (excluding runner wait & post-steps): \`${elapsed}s\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Docker setup: ${SETUP_S}s"
          echo "Docker job execution: ${elapsed}s"

  build-and-test:
    name: Build and Test Docker Image
    runs-on: ubuntu-26.04
    needs: [build-and-test-image, validate-filebeat]
    if: always()
    steps:
      - name: Verify all required Docker checks passed
        env:
          IMAGE_RESULT: ${{ needs.build-and-test-image.result }}
          FILEBEAT_RESULT: ${{ needs.validate-filebeat.result }}
        run: |
          set -euo pipefail
          echo "build-and-test-image: ${IMAGE_RESULT}"
          echo "validate-filebeat: ${FILEBEAT_RESULT}"
          if [ "$IMAGE_RESULT" != "success" ] || [ "$FILEBEAT_RESULT" != "success" ]; then
            echo "::error::Required Docker check did not succeed (image=${IMAGE_RESULT}, filebeat=${FILEBEAT_RESULT})."
            exit 1
          fi

  push:
    name: Push Docker Image
    runs-on: ubuntu-26.04
    needs: [build-and-test-image, build-and-test]
    if: ${{ success() && github.event_name != 'pull_request' && !inputs.dry_run && inputs.version != '' }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download Docker image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image
          path: /tmp

      - name: Load and push Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ inputs.version }}
        run: |
          docker load --input /tmp/bridgewatcher.tar

          IMAGE_NAME="$DOCKERHUB_USERNAME/${{ env.IMAGE_NAME }}"
          VERSION_TAG="$IMAGE_NAME:$VERSION"
          LATEST_TAG="$IMAGE_NAME:latest"

          docker tag "$VERSION_TAG" "$LATEST_TAG"

          echo "Pushing $VERSION_TAG..."
          docker push "$VERSION_TAG"

          echo "Pushing $LATEST_TAG..."
          docker push "$LATEST_TAG"

          echo " Successfully pushed Docker images"

      - name: Clean up
        if: always()
        run: |
          docker system prune -f
