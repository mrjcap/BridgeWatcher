version: '3.8'

services:
  bridgewatcher:
    image: mrjcap/bridgewatcher:latest
    container_name: bridgewatcher
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    tmpfs:
      - /tmp:rw,noexec,nosuid
    volumes:
      - log-data:/app/logs
    secrets:
      - api_key
      - pushover_token
      - pushover_user

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.5.7@sha256:6249b9ebe009870253817e73276ada580751aba41844bbb7923f9b764d3e94ad
    container_name: bridgewatcher-filebeat
    profiles:
      - siem
    restart: unless-stopped
    user: root
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - log-data:/var/log/bridgewatcher:ro
      - ./Docker/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    depends_on:
      - bridgewatcher

volumes:
  log-data:

secrets:
  api_key:
    file: ./secrets/api_key
  pushover_token:
    file: ./secrets/pushover_token
  pushover_user:
    file: ./secrets/pushover_user
