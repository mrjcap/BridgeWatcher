filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/bridgewatcher/*.log
    tags: ["bridgewatcher"]

output.logstash:
  hosts: ["your-logstash-siem-host:5044"]
  # Alternatively, output directly to Elasticsearch:
  # hosts: ["your-elasticsearch-siem-host:9200"]
  # protocol: "https"
  # username: "elastic"
  # password: "changeme"
