filebeat.inputs:
  - type: filestream
    id: bridgewatcher-logs
    enabled: true
    paths:
      - /var/log/bridgewatcher/*.log
    tags: ["bridgewatcher"]

output.elasticsearch:
  hosts: ["${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT:9200}"]
  protocol: "${ELASTICSEARCH_PROTOCOL:https}"
  username: "${ELASTICSEARCH_USERNAME}"
  password: "${ELASTICSEARCH_PASSWORD}"
